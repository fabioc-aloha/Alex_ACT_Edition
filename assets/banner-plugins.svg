<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="ACT Edition Plugins — Multi-agent orchestration for your AI assistant">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" rx="12" fill="url(#bg)"/>
  <!-- Corner accents -->
  <path d="M0,12 Q0,0 12,0 L60,0" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <path d="M0,12 L0,60" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <path d="M1140,0 L1188,0 Q1200,0 1200,12" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <path d="M1200,12 L1200,60" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <!-- Plugin icon: interlocking puzzle pieces -->
  <g transform="translate(80, 100)">
    <rect x="-30" y="-30" width="28" height="28" rx="4" fill="#f59e0b" opacity="0.7"/>
    <rect x="2" y="-30" width="28" height="28" rx="4" fill="#f97316" opacity="0.6"/>
    <rect x="-30" y="2" width="28" height="28" rx="4" fill="#ef4444" opacity="0.5"/>
    <rect x="2" y="2" width="28" height="28" rx="4" fill="url(#blue)" opacity="0.5"/>
    <!-- Connection dots -->
    <circle cx="0" cy="-16" r="3" fill="#f8fafc" opacity="0.6"/>
    <circle cx="-16" cy="0" r="3" fill="#f8fafc" opacity="0.6"/>
    <circle cx="0" cy="16" r="3" fill="#f8fafc" opacity="0.4"/>
    <circle cx="16" cy="0" r="3" fill="#f8fafc" opacity="0.4"/>
  </g>
  <!-- Title -->
  <text x="160" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#f8fafc">ACT Edition Plugins</text>
  <!-- Tagline -->
  <text x="160" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Multi-agent orchestration, security compliance, and Azure SDK patterns</text>
  <!-- Accent line -->
  <rect x="160" y="124" width="100" height="2" rx="1" fill="url(#accent)" opacity="0.7"/>
  <!-- Stats -->
  <g transform="translate(160, 145)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="52" y="19" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">12 plugins</text>
    <rect x="115" y="0" width="115" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="172" y="19" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">30+ agents</text>
    <rect x="240" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="302" y="19" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">80+ SDK skills</text>
  </g>
  <!-- Right side value cards -->
  <g transform="translate(820, 30)">
    <rect x="0" y="0" width="240" height="30" rx="6" fill="#f59e0b" opacity="0.12"/>
    <rect x="0" y="0" width="240" height="30" rx="6" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.35"/>
    <text x="14" y="20" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">Adversarial code review</text>
    <rect x="20" y="38" width="250" height="30" rx="6" fill="#ef4444" opacity="0.1"/>
    <rect x="20" y="38" width="250" height="30" rx="6" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.3"/>
    <text x="34" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">SFI compliance automation</text>
    <rect x="10" y="76" width="230" height="30" rx="6" fill="#38bdf8" opacity="0.12"/>
    <rect x="10" y="76" width="230" height="30" rx="6" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
    <text x="24" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">Azure SDK for every language</text>
    <rect x="30" y="114" width="220" height="30" rx="6" fill="#34d399" opacity="0.12"/>
    <rect x="30" y="114" width="220" height="30" rx="6" fill="none" stroke="#34d399" stroke-width="1" opacity="0.3"/>
    <text x="44" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">STRIDE threat modeling</text>
  </g>
</svg>
