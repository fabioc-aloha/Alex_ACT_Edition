name: Alex ACT self-update

# Optional periodic auto-pull from Alex_ACT_Edition.
#
# This workflow is OFF by default. To enable: rename to alex-act-self-update.yml
# (already named), commit it, and adjust the schedule. Heirs that prefer manual
# upgrades should delete this file or set the schedule far in the future.
#
# What it does:
#   - Weekly (Mondays 09:00 UTC), runs `node scripts/upgrade-self.cjs --apply`
#   - If anything changed, opens a PR titled "Sync to Alex_ACT_Edition <version>"
#   - Major bumps are NOT auto-applied (script returns 2 without --allow-major)
#
# Heir-owned. Edit freely; the upgrade-self script does NOT overwrite this file.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      allow-major:
        description: 'Allow major Edition bump'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run upgrade-self
        id: upgrade
        run: |
          set +e
          if [ "${{ github.event.inputs.allow-major }}" = "true" ]; then
            node scripts/upgrade-self.cjs --apply --allow-major
          else
            node scripts/upgrade-self.cjs --apply
          fi
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$(node -e "console.log(require('./.github/.act-heir.json').edition_version)")" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Open PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: alex-act/sync-${{ steps.changes.outputs.version }}
          commit-message: 'Sync to Alex_ACT_Edition ${{ steps.changes.outputs.version }}'
          title: 'Sync to Alex_ACT_Edition ${{ steps.changes.outputs.version }}'
          body: |
            Automated sync via `scripts/upgrade-self.cjs`. Review the diff before merging.

            Major bumps require re-running with `--allow-major`.
