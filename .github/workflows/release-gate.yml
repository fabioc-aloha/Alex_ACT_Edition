name: Release Gate

# AP-07: VERSION/tag/CHANGELOG sync gate.
# Closes the operator-memory failure mode that shipped VERSION-vs-tag drift on
# 2026-05-22 and 2026-05-24. Authoritative spec in:
#   Alex_ACT_Supervisor/.github/skills/release-preflight/SKILL.md § Go/No-Go.
# Falsifier: re-evaluate by 2026-09-10 (90 days). Sunset if it produces no
# blocked-release events in that window AND no recurrence either (the gate is
# decorative — operator memory was already sufficient).

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/VERSION'
      - 'CHANGELOG.md'

jobs:
  version-tag-changelog-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve target version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "source=tag" >> "$GITHUB_OUTPUT"
            echo "value=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          else
            FILE_VERSION="$(tr -d '[:space:]' < .github/VERSION)"
            echo "source=file" >> "$GITHUB_OUTPUT"
            echo "value=${FILE_VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "Target version resolved from ${{ steps.version.outputs.source || 'pending' }}: ${TAG_VERSION:-$FILE_VERSION}"

      - name: Assert .github/VERSION matches resolved version
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.version.outputs.value }}"
          FILE_VERSION="$(tr -d '[:space:]' < .github/VERSION)"
          if [[ "${FILE_VERSION}" != "${TARGET}" ]]; then
            echo "::error file=.github/VERSION::.github/VERSION is '${FILE_VERSION}', expected '${TARGET}' (from ${{ steps.version.outputs.source }})"
            exit 1
          fi
          echo "OK: .github/VERSION (${FILE_VERSION}) matches target (${TARGET})"

      - name: Assert CHANGELOG has entry for target version
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.version.outputs.value }}"
          if ! grep -qE "^## \[${TARGET}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## [${TARGET}]' entry"
            exit 1
          fi
          echo "OK: CHANGELOG.md contains '## [${TARGET}]'"
